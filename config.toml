title = "r-Portfolio"
base_url = ""
lang = "ja"
typst = "typst"
content_dir = "content"
templates_dir = "templates"
static_dir = "static"
out_dir = "dist"
# Optional URL pattern. Placeholders: :section, :slug, :path, :filename, :year, :month, :day
# permalink = "/:section/:slug/"
cache_dir = ".typage"
default_template = "base.typ"
list_template = "list.typ"
features = "html"
bundle_features = "bundle,html"
build_pdf = false
build_future = true
build_expired = false
fail_on_broken_links = true
paginate_by = 100
feed = true
feed_path = "rss.xml"
feed_description = "Blog posts and projects from r-Portfolio."
feed_sections = ["blog", "projects"]
feed_limit = 0
atom_feed = false
sitemap = false
robots = false
jobs = 0 # 0 = auto
# Start without taxonomies. Add [[taxonomies]] entries when needed.
taxonomies = []

# Keep the starter minimal. Enable search when you add a search page.
[search]
enabled = false
mode = "auto"      # auto | latin | cjk | ngram | ngram-only
ngram = 2
include_body = true
include_headings = true
include_tags = true
include_taxonomies = true
compact = false
max_tokens = 2048

[extra]
description = "r-Portfolio is a personal portfolio and blog for sharing research, projects, publications, and notes."
image = "/logo.png"
blog_description = "A collection of articles on topics I am passionate about."
awards_description = "A showcase of my experiences and achievements."
publications_description = "A showcase of my publications and research work."
projects_description = "A collection of my projects, with links to repositories and demos."
favorites_description = "A collection of my favorites."
email = "yoneyama@ai.cs.ehime-u.ac.jp"
copyright_year = "2026"
num_posts_on_homepage = 3
num_projects_on_homepage = 3
nav = [
  { key = "blog", label = "blog", href = "/blog/" },
  { key = "awards", label = "awards", href = "/awards/" },
  { key = "publications", label = "publications", href = "/publications/" },
  { key = "projects", label = "projects", href = "/projects/" },
  { key = "favorites", label = "favorites", href = "/favorites/" },
]
socials = [
  { name = "X", href = "https://x.com/ynym_8" },
  { name = "GitHub", href = "https://github.com/rice8y" },
  { name = "Gist", href = "https://gist.github.com/rice8y" },
  { name = "Qiita", href = "https://qiita.com/rice8y" },
  { name = "LinkedIn", href = "https://www.linkedin.com/in/eito-yoneyama-8929b0323" },
]

[[feeds]]
path = "blog/rss.xml"
title = "r-Portfolio Blog"
description = "Blog posts from r-Portfolio."
link = "/blog/"
section = "blog"
limit = 0

[[feeds]]
path = "projects/rss.xml"
title = "r-Portfolio Projects"
description = "Projects from r-Portfolio."
link = "/projects/"
section = "projects"
limit = 0

[scripts]
build = "build"
dev = "serve --live-reload"
preview = "serve"
check = "doctor"
clean = "clean"
deploy-check = "deploy doctor"

[hooks]
# Hooks run from the site root. They may call external commands or `typage ...`.
# Nested typage commands run from hooks do not trigger hooks again.
# pre_build = "echo before build"
# post_build = "echo after build"
# pre_serve = "echo before serve"
# post_serve = "echo after serve"
# pre_deploy = "echo before deploy"
# post_deploy = "echo after deploy"
